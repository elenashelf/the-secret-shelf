


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Shelf | The Secret Shelf</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #faf3ed;
      color: #5b4038;
      font-family: 'Lora', serif;
      line-height: 1.6;
    }

    .top-nav {
      padding: 18px 24px;
      text-align: center;
      background: #fffaf6;
      border-bottom: 1px solid #e6c9c1;
    }

    .top-nav a {
      margin: 0 12px;
      color: #8d5661;
      text-decoration: none;
    }

    .top-nav a:hover { text-decoration: underline; }

    .hero {
      text-align: center;
      padding: 42px 20px 24px;
    }

    .hero h1 {
      margin: 0;
      color: #9b5c68;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3rem, 7vw, 4.5rem);
      line-height: 1.1;
    }

    .hero p {
      color: #8b6b62;
      font-style: italic;
    }

    main {
      width: min(1200px, 100%);
      margin: auto;
      padding: 20px;
    }

    .shelves-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      align-items: start;
    }

    .shelf-section {
      min-width: 0;
      padding: 25px;
      background: #fffaf6;
      border: 1px solid #e6c9c1;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(120, 80, 70, .10);
    }

    .shelf-section h2 {
      margin: 0 0 20px;
      color: #9b5c68;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.3rem;
    }

    button { font: inherit; }

    .add-button, .save-button, .cancel-button,
    .edit-book-button, .delete-book-button {
      padding: 10px 17px;
      border: 1px solid #d5a9a0;
      border-radius: 30px;
      cursor: pointer;
      transition: .2s ease;
    }

    .add-button, .save-button {
      background: #9b5c68;
      color: #fffaf6;
    }

    .add-button {
      display: block;
      margin: 0 auto 22px;
    }

    .add-button:hover, .save-button:hover {
      background: #824956;
    }

    .book-form[hidden] { display: none !important; }

    .book-form {
      margin-bottom: 25px;
      padding: 20px;
      background: #fdf1eb;
      border: 1px solid #e6c9c1;
      border-radius: 18px;
    }

    .book-form h3 {
      margin: 0 0 15px;
      color: #9b5c68;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.8rem;
    }

    .book-form label {
      display: block;
      margin: 13px 0;
      font-weight: 500;
    }

    .book-form input[type="text"],
    .book-form select,
    .book-form textarea {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      border: 1px solid #d5a9a0;
      border-radius: 10px;
      background: #fffaf6;
      color: #5b4038;
      font: inherit;
    }

    .book-form input[type="file"] {
      display: block;
      width: 100%;
      margin-top: 8px;
      font: inherit;
    }

    .cover-preview {
      width: min(100%, 220px);
      aspect-ratio: 1 / 1;
      margin: 15px auto;
      overflow: hidden;
      background: #f3e2da;
      border: 2px dashed #d5a9a0;
      border-radius: 12px;
    }

    .cover-preview[hidden] { display: none !important; }

    .cover-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .form-buttons, .book-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 16px;
    }

    .cancel-button, .edit-book-button {
      background: #f3e2da;
      color: #704b43;
    }

    .delete-book-button {
      background: #fffaf6;
      border-color: #c98d91;
      color: #9b3f4d;
    }

    .add-button:hover, .save-button:hover,
    .cancel-button:hover, .edit-book-button:hover,
    .delete-book-button:hover {
      transform: translateY(-1px);
    }

    .reading-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .book-card {
      min-width: 0;
      padding: 16px;
      overflow-wrap: anywhere;
      background: #fffaf6;
      border: 1px solid #e6c9c1;
      border-radius: 19px;
      box-shadow: 0 5px 15px rgba(120, 80, 70, .08);
      text-align: center;
    }

    .cover-placeholder {
      display: flex;
      width: 100%;
      aspect-ratio: 1 / 1;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      overflow: hidden;
      background: #f8eee8;
      border: 2px dashed #d5a9a0;
      border-radius: 12px;
      color: #9b756c;
      font-style: italic;
    }

    .cover-placeholder img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .book-card h3 {
      margin: 8px 0;
      color: #9b5c68;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.7rem;
      line-height: 1.2;
    }

    .book-card p { margin: 9px 0; }

    .book-rating {
      color: #b47c38;
      letter-spacing: 2px;
    }

    .notes {
      padding: 12px;
      background: #fdf1eb;
      border-radius: 12px;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty-message {
      color: #9b756c;
      text-align: center;
      font-style: italic;
    }

    .empty-message[hidden] { display: none; }

    @media (max-width: 760px) {
      .shelves-container { grid-template-columns: 1fr; }
      .shelf-section { padding: 18px; }
      .top-nav a { display: inline-block; margin: 4px 8px; }
    }
  </style>
</head>

<body>
  <nav class="top-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="shelf.html">Our Shelf</a>
  </nav>

  <header class="hero">
    <h1>Our Shelf</h1>
    <p>Two readers, two shelves, countless stories.</p>
  </header>

  <main>
    <div class="shelves-container">

      <!-- ELENA'S SHELF -->
      <section class="shelf-section" data-shelf="elena">
        <h2>Elena's Shelf</h2>
        <button class="add-button" type="button">+ Add book</button>

        <form class="book-form" hidden>
          <h3>Add a new book</h3>

          <label>
            Book cover
            <input name="cover" type="file" accept="image/*">
          </label>

          <div class="cover-preview" hidden>
            <img alt="Book cover preview">
          </div>

          <label>
            Title *
            <input name="title" type="text" required maxlength="160"
                   placeholder="Book title">
          </label>

          <label>
            Author *
            <input name="author" type="text" required maxlength="120"
                   placeholder="Author's name">
          </label>

          <label>
            Rating
            <select name="rating">
              <option value="5">★★★★★</option>
              <option value="4">★★★★☆</option>
              <option value="3">★★★☆☆</option>
              <option value="2">★★☆☆☆</option>
              <option value="1">★☆☆☆☆</option>
            </select>
          </label>

          <label>
            Review
            <textarea name="review" rows="4"
                      placeholder="Write your thoughts about the book..."></textarea>
          </label>

          <div class="form-buttons">
            <button class="save-button" type="submit">Save book</button>
            <button class="cancel-button" type="button">Cancel</button>
          </div>
        </form>

        <div class="reading-container" aria-live="polite"></div>
        <p class="empty-message">Your shelf is waiting for its first story.</p>
      </section>

      <!-- STEFY'S SHELF -->
      <section class="shelf-section" data-shelf="stefy">
        <h2>Stefy's Shelf</h2>
        <button class="add-button" type="button">+ Add book</button>

        <form class="book-form" hidden>
          <h3>Add a new book</h3>

          <label>
            Book cover
            <input name="cover" type="file" accept="image/*">
          </label>

          <div class="cover-preview" hidden>
            <img alt="Book cover preview">
          </div>

          <label>
            Title *
            <input name="title" type="text" required maxlength="160"
                   placeholder="Book title">
          </label>

          <label>
            Author *
            <input name="author" type="text" required maxlength="120"
                   placeholder="Author's name">
          </label>

          <label>
            Rating
            <select name="rating">
              <option value="5">★★★★★</option>
              <option value="4">★★★★☆</option>
              <option value="3">★★★☆☆</option>
              <option value="2">★★☆☆☆</option>
              <option value="1">★☆☆☆☆</option>
            </select>
          </label>

          <label>
            Review
            <textarea name="review" rows="4"
                      placeholder="Write your thoughts about the book..."></textarea>
          </label>

          <div class="form-buttons">
            <button class="save-button" type="submit">Save book</button>
            <button class="cancel-button" type="button">Cancel</button>
          </div>
        </form>

        <div class="reading-container" aria-live="polite"></div>
        <p class="empty-message">Your shelf is waiting for its first story.</p>
      </section>

    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "theSecretShelfBooks_v1";

      function emptyShelves() {
        return { elena: [], stefy: [] };
      }

      function loadBooks() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return emptyShelves();

          const parsed = JSON.parse(stored);
          return {
            elena: Array.isArray(parsed.elena) ? parsed.elena : [],
            stefy: Array.isArray(parsed.stefy) ? parsed.stefy : []
          };
        } catch (error) {
          alert("Saved books could not be read. Your existing browser data has not been deleted.");
          return emptyShelves();
        }
      }

      let books = loadBooks();

      function persistBooks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
          return true;
        } catch (error) {
          alert(
            "The books could not be saved in this browser. " +
            "The cover image may be too large. Try a smaller image."
          );
          return false;
        }
      }

      function newId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return String(Date.now()) + Math.random().toString(16).slice(2);
      }

      // Resize covers before saving, to reduce browser storage usage.
      function prepareCover(file) {
        return new Promise(function (resolve, reject) {
          if (!file) {
            resolve("");
            return;
          }

          if (!file.type.startsWith("image/")) {
            reject(new Error("Please select an image file."));
            return;
          }

          const reader = new FileReader();

          reader.onerror = function () {
            reject(new Error("The image could not be read."));
          };

          reader.onload = function () {
            const image = new Image();

            image.onerror = function () {
              reject(new Error("The selected image could not be opened."));
            };

            image.onload = function () {
              const maxSize = 600;
              const scale = Math.min(
                1,
                maxSize / Math.max(image.naturalWidth, image.naturalHeight)
              );

              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
              canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

              const context = canvas.getContext("2d");
              if (!context) {
                reject(new Error("The image could not be processed."));
                return;
              }

              context.fillStyle = "#fffaf6";
              context.fillRect(0, 0, canvas.width, canvas.height);
              context.drawImage(image, 0, 0, canvas.width, canvas.height);

              try {
                resolve(canvas.toDataURL("image/jpeg", 0.78));
              } catch (error) {
                reject(new Error("The image could not be prepared."));
              }
            };

            image.src = reader.result;
          };

          reader.readAsDataURL(file);
        });
      }

      function createBookCard(shelfKey, book) {
        const card = document.createElement("article");
        card.className = "book-card";

        const cover = document.createElement("div");
        cover.className = "cover-placeholder";

        if (book.cover) {
          const image = document.createElement("img");
          image.src = book.cover;
          image.alt = "Cover of " + book.title;
          cover.appendChild(image);
        } else {
          cover.textContent = "Book cover";
        }

        const title = document.createElement("h3");
        title.textContent = book.title;

        const author = document.createElement("p");
        author.textContent = "by " + book.author;

        const rating = document.createElement("p");
        rating.className = "book-rating";
        rating.textContent =
          "★".repeat(Number(book.rating)) +
          "☆".repeat(5 - Number(book.rating));
        rating.setAttribute("aria-label", book.rating + " out of 5 stars");

        const review = document.createElement("p");
        review.className = "notes";
        review.textContent = book.review || "No review added yet.";

        const actions = document.createElement("div");
        actions.className = "book-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-book-button";
        editButton.textContent = "✏️ Edit";
        editButton.addEventListener("click", function () {
          openForm(shelfKey, book.id);
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-book-button";
        deleteButton.textContent = "🗑 Delete";
        deleteButton.addEventListener("click", function () {
          const confirmed = window.confirm(
            'Are you sure you want to delete "' + book.title + '"?'
          );

          if (!confirmed) return;

          const previousBooks = books[shelfKey];
          books[shelfKey] = previousBooks.filter(function (item) {
            return item.id !== book.id;
          });

          if (!persistBooks()) {
            books[shelfKey] = previousBooks;
            return;
          }

          renderShelf(shelfKey);
        });

        actions.append(editButton, deleteButton);
        card.append(cover, title, author, rating, review, actions);

        return card;
      }

      function renderShelf(shelfKey) {
        const shelf = document.querySelector(
          '[data-shelf="' + shelfKey + '"]'
        );

        const container = shelf.querySelector(".reading-container");
        const emptyMessage = shelf.querySelector(".empty-message");

        container.replaceChildren();

        books[shelfKey].forEach(function (book) {
          container.appendChild(createBookCard(shelfKey, book));
        });

        emptyMessage.hidden = books[shelfKey].length > 0;
      }

      function openForm(shelfKey, bookId) {
        const shelf = document.querySelector(
          '[data-shelf="' + shelfKey + '"]'
        );
        const form = shelf.querySelector(".book-form");
        const preview = form.querySelector(".cover-preview");
        const previewImage = preview.querySelector("img");

        form.reset();

        const book = bookId
          ? books[shelfKey].find(function (item) {
              return item.id === bookId;
            })
          : null;

        form.dataset.editingId = book ? book.id : "";

        form.querySelector("h3").textContent =
          book ? "Edit book" : "Add a new book";

        form.querySelector('[type="submit"]').textContent =
          book ? "Update book" : "Save book";

        if (book) {
          form.elements.title.value = book.title;
          form.elements.author.value = book.author;
          form.elements.rating.value = String(book.rating);
          form.elements.review.value = book.review || "";

          if (book.cover) {
            previewImage.src = book.cover;
            preview.hidden = false;
          } else {
            previewImage.removeAttribute("src");
            preview.hidden = true;
          }
        } else {
          previewImage.removeAttribute("src");
          preview.hidden = true;
        }

        form.hidden = false;
        form.scrollIntoView({ behavior: "smooth", block: "nearest" });
        form.elements.title.focus();
      }

      document.querySelectorAll(".shelf-section").forEach(function (shelf) {
        const shelfKey = shelf.dataset.shelf;
        const form = shelf.querySelector(".book-form");
        const coverInput = form.elements.cover;
        const preview = form.querySelector(".cover-preview");
        const previewImage = preview.querySelector("img");

        shelf.querySelector(".add-button").addEventListener("click", function () {
          openForm(shelfKey, null);
        });

        shelf.querySelector(".cancel-button").addEventListener("click", function () {
          form.reset();
          form.hidden = true;
          form.dataset.editingId = "";
          preview.hidden = true;
          previewImage.removeAttribute("src");
        });

        coverInput.addEventListener("change", function () {
          const file = coverInput.files && coverInput.files[0];

          if (!file) return;

          if (!file.type.startsWith("image/")) {
            alert("Please choose an image file.");
            coverInput.value = "";
            return;
          }

          const reader = new FileReader();

          reader.onload = function () {
            previewImage.src = reader.result;
            preview.hidden = false;
          };

          reader.readAsDataURL(file);
        });

        form.addEventListener("submit", async function (event) {
          event.preventDefault();

          const title = form.elements.title.value.trim();
          const author = form.elements.author.value.trim();
          const rating = Number(form.elements.rating.value);
          const review = form.elements.review.value.trim();
          const editingId = form.dataset.editingId;

          if (!title || !author) {
            alert("Please enter both the title and the author.");
            return;
          }

          const existing = editingId
            ? books[shelfKey].find(function (item) {
                return item.id === editingId;
              })
            : null;

          const saveButton = form.querySelector('[type="submit"]');
          saveButton.disabled = true;

          try {
            const file = coverInput.files && coverInput.files[0];
            const uploadedCover = file ? await prepareCover(file) : null;

            const updatedBook = {
              id: existing ? existing.id : newId(),
              title: title,
              author: author,
              rating: rating,
              review: review,
              cover: uploadedCover !== null
                ? uploadedCover
                : (existing ? existing.cover : "")
            };

            const previousBooks = books[shelfKey].slice();

            if (existing) {
              books[shelfKey] = books[shelfKey].map(function (item) {
                return item.id === existing.id ? updatedBook : item;
              });
            } else {
              books[shelfKey].push(updatedBook);
            }

            if (!persistBooks()) {
              books[shelfKey] = previousBooks;
              return;
            }

            renderShelf(shelfKey);

            form.reset();
            form.hidden = true;
            form.dataset.editingId = "";
            preview.hidden = true;
            previewImage.removeAttribute("src");
          } catch (error) {
            alert(error.message || "The book could not be saved. Please try again.");
          } finally {
            saveButton.disabled = false;
          }
        });

        renderShelf(shelfKey);
      });
    })();
  </script>
</body>
</html>

</script>
</body>
</html>

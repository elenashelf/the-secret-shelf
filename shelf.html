
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Shelf | The Secret Shelf</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="dropdown-menu">
    <button class="menu-button" aria-label="Open menu">☰</button>
    <div class="dropdown-content">
        <a href="index.html">Home</a>
        <a href="shelf.html">Shelf</a>
        <a href="#">The Rankings</a>
        <a href="#">Book Talks</a>
        <a href="#">TBR List</a>
    </div>
</nav>

<header class="hero">
    <h1>Our Shelf</h1>
    <p class="subtitle">Two readers, two shelves, countless stories</p>
</header>

<main>
    <div class="shelves-container">

        <!-- ELENA -->
        <section class="shelf-section">
            <h2>Elena's Shelf</h2>

            <button class="add-button" type="button">+ Add book</button>

            <form class="book-form" hidden>
                <h3>Add a new book</h3>

                <label>Book title
                    <input name="title" type="text" required placeholder="Enter the title">
                </label>

                <label>Author
                    <input name="author" type="text" required placeholder="Enter the author">
                </label>

                <label>Rating (1–5)
                    <select name="rating" required>
                        <option value="5" selected>5 stars</option>
                        <option value="4">4 stars</option>
                        <option value="3">3 stars</option>
                        <option value="2">2 stars</option>
                        <option value="1">1 star</option>
                    </select>
                </label>

                <label>Your review
                    <textarea name="review" rows="3" placeholder="What did you think of the book?"></textarea>
                </label>

                <div class="form-buttons">
                    <button type="submit" class="add-button">Save book</button>
                    <button type="button" class="cancel-button">Cancel</button>
                </div>
            </form>

            <div class="reading-container">
                <div class="book-card">
                    <div class="cover-placeholder">Cover</div>
                    <h3>Book title</h3>
                    <p><strong>Author:</strong> Name</p>
                    <p>⭐⭐⭐⭐⭐</p>
                    <p class="notes">Your review will be here...</p>
                </div>
            </div>
        </section>

        <!-- STEFY -->
        <section class="shelf-section">
            <h2>Stefy's Shelf</h2>

            <button class="add-button" type="button">+ Add book</button>

            <form class="book-form" hidden>
                <h3>Add a new book</h3>

                <label>Book title
                    <input name="title" type="text" required placeholder="Enter the title">
                </label>

                <label>Author
                    <input name="author" type="text" required placeholder="Enter the author">
                </label>

                <label>Rating (1–5)
                    <select name="rating" required>
                        <option value="5" selected>5 stars</option>
                        <option value="4">4 stars</option>
                        <option value="3">3 stars</option>
                        <option value="2">2 stars</option>
                        <option value="1">1 star</option>
                    </select>
                </label>

                <label>Your review
                    <textarea name="review" rows="3" placeholder="What did you think of the book?"></textarea>
                </label>

                <div class="form-buttons">
                    <button type="submit" class="add-button">Save book</button>
                    <button type="button" class="cancel-button">Cancel</button>
                </div>
            </form>

            <div class="reading-container">
                <div class="book-card">
                    <div class="cover-placeholder">Cover</div>
                    <h3>Book title</h3>
                    <p><strong>Author:</strong> Name</p>
                    <p>⭐⭐⭐⭐⭐</p>
                    <p class="notes">Your review will be here...</p>
                </div>
            </div>
        </section>

    </div>
</main>

<script>
document.querySelectorAll(".shelf-section").forEach(function(shelf) {
    const addButton = shelf.querySelector(".add-button");
    const form = shelf.querySelector(".book-form");
    const cancelButton = shelf.querySelector(".cancel-button");
    const readingContainer = shelf.querySelector(".reading-container");

    addButton.addEventListener("click", function() {
        form.hidden = !form.hidden;
    });

    cancelButton.addEventListener("click", function() {
        form.reset();
        form.hidden = true;
    });

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const title = form.elements.title.value.trim();
        const author = form.elements.author.value.trim();
        const rating = Number(form.elements.rating.value);
        const review = form.elements.review.value.trim();

        if (!title || !author) return;

        const card = document.createElement("div");
        card.className = "book-card";

        const cover = document.createElement("div");
        cover.className = "cover-placeholder";
        cover.textContent = "Cover";

        const heading = document.createElement("h3");
        heading.textContent = title;

        const authorLine = document.createElement("p");
        const authorLabel = document.createElement("strong");
        authorLabel.textContent = "Author: ";
        authorLine.append(authorLabel, document.createTextNode(author));

        const stars = document.createElement("p");
        stars.textContent = "⭐".repeat(rating);

        const notes = document.createElement("p");
        notes.className = "notes";
        notes.textContent = review || "No review yet.";

        card.append(cover, heading, authorLine, stars, notes);
        readingContainer.appendChild(card);

        form.reset();
        form.hidden = true;
    });
});
</script>

</body>
</html>

</html>
